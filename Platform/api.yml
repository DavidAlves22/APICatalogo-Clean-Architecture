services:
  mysql2:
    image: mysql:5.6
    container_name: mysql2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apiCatalogo
      MYSQL_USER: david
      MYSQL_PASSWORD: "@David123"
    ports:
      - "3320:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data: